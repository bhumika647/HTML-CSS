<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>
    *{
        margin: 0;
        padding: 0;
        
    }
    .main-container {
        border: 5px solid black;
        height: 100vh;/*vh means viewport height*/
        background-color: #a8d0a5;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .card {
        /* border: 2px solid white; */
        border-radius: 30px;
        height: 80%;
        width: 30%;
        background-color: white;
      
        }
    
    .image_container {
        height: 50%;
        background-color: #7b7ac6;
        border: #000000;
        border-radius: 30px 30px 0 0;
        display: flex;
        justify-content: center;

        

    }
    .image_container img{
        width: 100%;
        height: 95%;
        padding: 2%;
        margin: 1%;     
        
    }
    
    .image-container img:hover{
        scale: 1.2;
    }

    .image-description {
        height: 35%;
        padding:20px;
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        /* justify-items: center; */
        align-content: center;
        border-bottom: 1px solid lightgrey;

    }

    .image-description p{
        font-size: 18px;
    }

    .img-desc-btn{
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .img-desc-btn button{
        height: 65%;
        width: 30%;
        border-radius: 5px;
        border:1px solid lightgrey;
        background-color: transparent;
    }

    .image-price{
        height:15%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
    }

    .image-price h1 span{
        font-size: 18px;
        font-weight: 300;
        text-decoration: line-through;
    }

    .image-price button{
        width: 60%;
        height: 90%;
        border:none;
        border-radius: 5px;
        background: linear-gradient(to right, #45e84f, #c7ee35);
        transition: 0.5s ease-in-out;
    }

    .image-price button:hover{
        cursor: pointer;
        scale: 1.1;

    }

        

    


</style>
<body>
<div class="main-container">
    <div class="card">
        
    <div class="image_container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDPM12SLs6m-BiXkj595v19bOzHrgXeT5pAnHWK5m1SyasdgU1m3vSPDMP&s=10" alt="image">
    </div>
    <div class = "img_discription">
        <h1>Boat Stone 1200F</h1>
                <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quos, animi.</p>
                <div class="img-desc-btn">
                    <button>Green</button>
                    <button>Just the Device</button>
                </div>
            </div>
            <div class="image-price">
                <h1><span>$2000</span>$599</h1>
                <button>+ Add to Cart</button>
            </div>
        </div>
    </div>
</body>

</html>
