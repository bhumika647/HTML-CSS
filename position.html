<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
    }
    .navbar {
    height: 60px;
    background-color: #7eb2e6;
    border-bottom: 1px solid #0f74d9;
    width: 100%;
    font-size: 20px;
    display: flex;
    /*justify-content: center;*/
    align-items: center;
 padding-left: 27px;
    font-family: Arial, Helvetica, sans-serif;
    position: sticky;
    top: 0;
    }
    .container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 50vh;
        width: 100%;
        padding: 20px;

    }
    .box {
        width: 400px;
        height: 200px;
        background-color: #e0e786;
        margin: 10px;
        border-radius: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
        font-family: "Poppins", sans-serif; 
        font-size: 20px;
    }
    .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
            height: 100vh;
        }
        .card {
    background : linear-gradient(to right,yellow,orange);
    border: 1px solid #ccc;
    border-radius: 50%;
    width: 180px;
    height: 180px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 20px;
    margin: 10px;
    border: 5px solid #ccc;
}
  
</style>

<body>
    
    <div class=" navbar">NavBar</div>
    <div class = "container">
        <div class="box">fruits</div>
        <div class="box">vegetables</div>
        <div class="box">grains</div>
    </div>
    <div class="card-container">
        <div class="card">
            <h3>Fresh Fruits</h3>
            <p>Discover a variety of fresh and delicious fruits!</p>
        </div>
        <div class="card">
            <h3>Vegetables</h3>
            <p>Get your daily dose of nutrients with our fresh vegetables.</p>
        </div>
        <div class="card">
            <h3>Daily Essentials</h3>
            <p>Your everyday needs, all in one place.</p>
        </div>
        <div class="card">
            <h3>Snacks</h3>
            <p>Tasty treats to satisfy your cravings.</p>
        </div>
    </div>
    <button style ="background-color: black; color: aqua; border-radius: 10px;
    padding: 10px; ">Click Me</button>
</body>
</html>
